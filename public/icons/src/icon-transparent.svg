<?xml version="1.0" encoding="UTF-8"?>
<!-- Sirroco brand mark — transparent background, used for tiles/adaptive contexts. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sailGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3654"/>
      <stop offset="100%" stop-color="#161e31"/>
    </linearGradient>
  </defs>

  <!-- water ripples -->
  <path d="M90,452 Q256,428 422,452" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  <path d="M70,480 Q256,462 442,480" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>

  <!-- hull -->
  <path d="M115.7,347.5
           C158.4,353.6 188.9,408.5 256,414.6
           C323.1,408.5 353.6,353.6 396.3,347.5
           Z"
        fill="url(#hullGrad)"/>
  <line x1="115.7" y1="347.5" x2="396.3" y2="347.5" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5"/>

  <!-- mast -->
  <line x1="256" y1="60.8" x2="256" y2="347.5" stroke="#f8fafc" stroke-width="8.7" stroke-linecap="round"/>

  <!-- sail -->
  <path d="M256,79.1
           C371.9,130 426.8,260 256,341.4
           Z"
        fill="url(#sailGrad)"/>
  <path d="M256,90 C340,135 380,240 256,320" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
</svg>
